<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>测测你是哪种小鸟</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --text: #2c2c2c;
      --text-light: #6b6b6b;
      --accent: #3a7d5c;
      --accent-light: #e8f0eb;
      --border: #e0ddd6;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 0 16px 40px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 560px; margin: 0 auto; }

    /* ===== 首页 ===== */
    #home { padding-top: 48px; text-align: center; }
    .home-icon { font-size: 64px; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; color: var(--accent); }
    .subtitle { font-size: 15px; color: var(--text-light); margin-bottom: 8px; }
    .desc { font-size: 14px; color: var(--text-light); margin-bottom: 32px; padding: 0 8px; }
    .btn {
      display: inline-block; width: 100%; padding: 16px 24px;
      background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
      font-size: 17px; font-weight: 600; cursor: pointer; transition: opacity .2s;
      letter-spacing: 2px;
    }
    .btn:active { opacity: .8; }
    .btn-secondary {
      background: transparent; color: var(--accent); border: 1.5px solid var(--accent);
    }
    .home-meta { margin-top: 24px; font-size: 13px; color: var(--text-light); }
    .home-meta span { display: inline-block; margin: 0 8px; }

    /* ===== 答题页 ===== */
    #quiz { display: none; padding-top: 20px; }
    .progress-wrap { position: sticky; top: 0; background: var(--bg); padding: 12px 0 16px; z-index: 10; }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s ease; width: 0%; }
    .progress-text { font-size: 13px; color: var(--text-light); text-align: right; margin-top: 6px; }
    .question-card {
      background: var(--card); border-radius: var(--radius); padding: 24px 20px;
      box-shadow: var(--shadow); margin-bottom: 16px;
    }
    .q-number { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; }
    .q-text { font-size: 18px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
    .option {
      display: block; width: 100%; text-align: left; padding: 14px 16px;
      background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 15px; color: var(--text); margin-bottom: 10px; cursor: pointer;
      transition: all .15s; font-family: inherit; line-height: 1.5;
    }
    .option:active { transform: scale(.98); }
    .option.selected { border-color: var(--accent); background: var(--accent-light); font-weight: 600; }
    .option .opt-letter {
      display: inline-block; width: 24px; height: 24px; line-height: 24px;
      text-align: center; border-radius: 50%; background: var(--border);
      font-size: 13px; font-weight: 700; margin-right: 10px; color: var(--text-light);
      vertical-align: middle;
    }
    .option.selected .opt-letter { background: var(--accent); color: #fff; }
    .nav-btns { display: flex; gap: 12px; margin-top: 8px; }
    .nav-btns .btn { flex: 1; padding: 14px; font-size: 16px; letter-spacing: 1px; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    /* ===== 结果页 ===== */
    #result { display: none; padding-top: 32px; }
    .result-card {
      background: var(--card); border-radius: var(--radius); padding: 32px 24px;
      box-shadow: var(--shadow); text-align: center; margin-bottom: 20px;
    }
    .bird-emoji { font-size: 72px; line-height: 1; margin-bottom: 12px; }
    .result-label { font-size: 13px; color: var(--text-light); letter-spacing: 2px; margin-bottom: 6px; }
    .bird-name { font-size: 26px; font-weight: 700; color: var(--accent); margin-bottom: 16px; letter-spacing: 1px; }
    .bird-desc { font-size: 15px; color: var(--text); line-height: 1.8; text-align: left; padding: 0 4px; }
    .result-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
    .tag { font-size: 12px; padding: 6px 12px; background: var(--accent-light); color: var(--accent); border-radius: 20px; font-weight: 500; }
    .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .actions .btn { padding: 15px; font-size: 16px; }

    /* ===== 页脚 ===== */
    .footer { text-align: center; font-size: 12px; color: var(--text-light); margin-top: 32px; padding: 16px 0; }

    /* ===== 淡入动画 ===== */
    .fade-in { animation: fadeIn .35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== 小屏适配 ===== */
    @media (max-width: 380px) {
      h1 { font-size: 24px; }
      .q-text { font-size: 16px; }
      .option { font-size: 14px; padding: 12px 14px; }
      .bird-name { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- ===== 首页 ===== -->
  <section id="home">
    <div class="home-icon">🐦</div>
    <h1>测测你是哪种小鸟</h1>
    <p class="subtitle">25道题 · 32种小鸟 · 找到你的那一只</p>
    <p class="desc">凭第一直觉作答，别想太多。每一种小鸟都有自己的生存哲学，没有哪种更好，只有哪种更像你。</p>
    <button class="btn" onclick="startQuiz()">开始测试</button>
    <div class="home-meta">
      <span>📱 手机适配</span>
      <span>⚡ 约 3 分钟</span>
    </div>
  </section>

  <!-- ===== 答题页 ===== -->
  <section id="quiz">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">1 / 25</div>
    </div>
    <div class="question-card" id="questionCard">
      <div class="q-number" id="qNumber">第 1 题</div>
      <div class="q-text" id="qText"></div>
      <div id="optionsWrap"></div>
    </div>
    <div class="nav-btns">
      <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">上一题</button>
      <button class="btn" id="nextBtn" onclick="nextQuestion()">下一题</button>
    </div>
  </section>

  <!-- ===== 结果页 ===== -->
  <section id="result">
    <div class="result-card">
      <div class="bird-emoji" id="birdEmoji">🐦</div>
      <div class="result-label">你 是</div>
      <div class="bird-name" id="birdName"></div>
      <div class="bird-desc" id="birdDesc"></div>
      <div class="result-tags" id="resultTags"></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="restart()">再测一次</button>
      <button class="btn btn-secondary" onclick="shareResult()">分享结果</button>
    </div>
    <div class="footer">仅供娱乐 · 每一种小鸟都有自己的活法</div>
  </section>

</div>

<script>

  "A_BC": { name: "黄腹山雀", emoji: "🐦", desc: "你活跃于自己热爱的领域，喜欢小圈子的高质量社交。你对生活的细节有自己的要求，但对于真正认定的朋友，你是一个巨大的“充电宝”。你不仅能提供实用的建议，更能提供满满的正向情绪价值。在朋友眼里，只要你在旁边，天塌下来好像也没那么可怕了。", tags: ["小圈子", "正能量", "细节控"] },
  "A_BD": { name: "红嘴蓝鹊", emoji: "🐦", desc: "你的外表或才华非常抢眼，就像拥有华丽羽色的鸟。你有自己极其明确的喜好和品位，绝不随波逐流。在群体里，你偶尔会展现出一点小脾气，那是因为你不愿意向平庸妥协。但大家依然非常喜欢你，因为你的真性情和你对美好事物的执着，在这个时代太难得了。", tags: ["品位出众", "真性情", "不将就"] },
  
  "A_CA": { name: "喜鹊", emoji: "🐦", desc: "你是典型的“硬核友善派”。平时看起来热络好客，什么都能吃，什么都好商量。但你的底线比谁都清楚。平时不惹事，但真要遇到什么不公平的事，或者朋友被欺负了，你绝对是第一个站出来硬刚的人，哪怕对手比你再强大，你也敢扑上去叫板。", tags: ["仗义", "底线清晰", "勇敢"] },
  "A_CB": { name: "鹊鸲", emoji: "🐦", desc: "你待人温和、说话好听，有一副让人如沐春风的好嗓子。但其实你内心非常“护食”，领地意识极强。你的心里有一块绝对不容侵犯的地方，无论是工作还是人际关系。一旦有人越界，你会立刻亮出爪子，毫不犹豫地反击，只不过你反击的动作总是保持着一份体面与分寸。", tags: ["温和且有锋芒", "边界感强", "有仇必报"] },
  "A_CC": { name: "白鹡鸰", emoji: "🐦", desc: "你是一个极有生活规律的人，走路时小尾巴一摇一摆，不紧不慢。吃东西讲究营养搭配，对季节的更替感知极其敏锐，总能把日子打理得井井有条。你不喜欢剧烈的变动，在你的圈子里面，你总是那个负责把控节奏、最靠谱的实干家。", tags: ["强迫症福音", "有条理", "养生达人"] },
  "A_CD": { name: "灰喜鹊", emoji: "🐦", desc: "你有着强烈的群体意识和团队精神。你非常看重身边的朋友，当你或你的朋友遇到困难时，你一定会纠集人手一起想办法。你极度重视健康，作息规律，在别人眼里，你既是一个合群的开心果，又是一个关键时刻能顶得住的靠谱队友。", tags: ["团队粘合剂", "极重友情", "健康至上"] },

  "A_DA": { name: "家燕", emoji: "🐦", desc: "你表面上随和好说话，但在你的内心深处，对“归属感”有着常人难以理解的执念。不论你飞得多高、走得多远，哪怕是飞越了千山万水，你的心里总有一个必须回去的地方。你极其守时，念旧，是那种无论何时何地，都会把老朋友和家放在心尖上的人。", tags: ["极度念旧", "恋家狂魔", "守时重诺"] },
  "A_DB": { name: "珠颈斑鸠", emoji: "🐦", desc: "你有一副标志性的好嗓音（可能平时话不多，但一开口就很稳）。你不追求轰轰烈烈，不喜欢内卷，日子就按自己的节奏慢慢过。你的存在感可能不是最强烈的，但只要有你在的地方，大家就会觉得安稳。你是那种一旦习惯了，就让人再也离不开的“陪伴型”人类。", tags: ["佛系人生", "陪伴感满分", "安稳自在"] },
  "A_DC": { name: "白喉林莺", emoji: "🐦", desc: "你小巧玲珑，非常灵活，不管是灌木丛还是高楼大厦，你都能迅速找到属于自己的生存缝隙。你对环境的嗅觉极其敏感，生活方式快慢有致，社交上随遇而安，绝不会为了合群而委屈自己。你不仅能在顺境里享受，更能在逆境里迅速找到破局的办法。", tags: ["适应力拉满", "进退自如", "随遇而安"] },
  "A_DD": { name: "树鹨", emoji: "🐦", desc: "你外表平静甚至有些不起眼，但一旦行动起来，行动力惊人。在人群中你比较内敛，不喜欢瞎凑热闹，更多时候是个观察者。但你看准目标后就会默默去努力。你朋友不多，但留下的绝对是知心之交，你信奉“与其低质量的社交，不如高质量的独处”。", tags: ["行动派", "内敛独行", "宁缺毋滥"] },

  "B_AA": { name: "绿头鸭", emoji: "🦆", desc: "你是那种到哪儿都能过得不错的“生存大师”。不挑食、不挑地方，南北通吃。别人可能觉得你很随意，但其实你的心里有一套非常清晰的舒适标准，只是你懒得对外人设限。你包容度极高，跟你在一起的人都会觉得很放松，因为你不卷别人，也不内耗自己。", tags: ["随遇而安", "兼容并蓄", "情绪价值高"] },
  "B_AB": { name: "红胸鸽", emoji: "🐦", desc: "你极其接受生活的“季节性”。天冷就收缩，天暖就舒展。你不硬扛、不逃避，节奏感是你最大的本事。你吃虫子也吃种子，说明你是个懂变通的人。在你的世界里，没有过不去的冬天，只要顺应时势，踏踏实实地积攒能量，下一个春天你依然能振翅高飞。", tags: ["能屈能伸", "节奏感强", "务实"] },
  "B_AC": { name: "绿头鸭（雌）", emoji: "🦆", desc: "你有着低调的保护色，不爱张扬，在角落里默默把生活经营得非常好。你对表面的光鲜亮丽不感兴趣，你更看重实际的安稳和握在手里的幸福。你是个踏实到骨子里的人，不管环境多么嘈杂，你都能找到一个安全的避风港，把自己的小日子过得热热乎乎。", tags: ["低调沉稳", "务实主义", "创造安全感"] },
  "B_AD": { name: "斑嘴鸭", emoji: "🦆", desc: "你是那种性格极其温和、人缘超好的存在。生活和饮食都非常接地气，绝不搞什么虚无缥缈的套路。你追求的是那种稳当、踏实的幸福感。在你身边，大家都会觉得特别有烟火气，你不矫情，不内耗，是长辈和朋友眼中最让人省心、最值得信赖的好孩子。", tags: ["温和敦厚", "烟火气", "安全感代名词"] },

  "B_BA": { name: "云雀（百灵）", emoji: "🐦", desc: "你是个有“绝活”的人。你有自己雷打不动的习惯，也有一个愿意反复打磨的“拿手好戏”。别人记住你，往往就是因为你身上那点闪闪发光的才华。你就像在草原上直冲云霄的歌手，只要给你一个舞台，你就能用你的专业能力征服所有人。", tags: ["才华横溢", "专注热爱", "习惯稳固"] },
  "B_BB": { name: "鹌鹑", emoji: "🐦", desc: "你不爱出风头，也不羡慕天上飞的鸟。比起那些虚无缥缈的宏大目标，你更愿意脚踏实地把眼前的每一件小事做好。你低调得甚至让人差点忽略你，但在你自己的节奏里，你过得无比舒适。你深知，生活是过给自己看的，稳稳当当才是真。", tags: ["脚踏实地", "反内卷先锋", "低调内敛"] },
  "B_BC": { name: "棕头鸦雀", emoji: "🐦", desc: "你是家庭和朋友聚会里的“主心骨”。你总是叽叽喳喳地操心着这个那个，看似有点啰嗦和小挑剔，但这背后全是对家人和朋友的关心。你希望大家都过得更好，所以常常愿意多承担一些，是一个嘴硬心软、极其护短的人。", tags: ["操心命", "家庭主心骨", "嘴硬心软"] },
  "B_BD": { name: "画眉", emoji: "🐦", desc: "你有着极高的生活标准，非常注重边界感。你的鸣声洪亮，内心世界丰富且独立。你不喜欢被打扰，只想在自己的小天地里安静地享受生活。别人觉得你高冷或者难搞，其实你只是不想把时间浪费在无意义的社交上。在自己的秩序里，你活得像个贵族。", tags: ["精神独立", "有格调", "极强的边界感"] },

  "B_CA": { name: "戴胜", emoji: "🐦", desc: "你是那种有点“怪”，但怪得自成一派的人。你头上戴着独有的冠羽，认准了一种活法就不太会改。你不迎合大众，也懒得解释自己。在懂你的人眼里，你简直是个天才和宝藏；在不懂你的人眼里，你就是个奇葩。但你根本不在乎，你只做自己。", tags: ["特立独行", "自我认同感强", "不迎合"] },
  "B_CB": { name: "啄木鸟", emoji: "🐦", desc: "你是典型的“深耕型”人格。笃笃笃，认定了一个领域就一头扎进去，日复一日地在同一片林子里干活。对你来说，重复不是折磨，而是精进的路径。你是那种只要给你足够的时间，就能在一个专业领域里凿出深井的人，专业度就是你最大的底气。", tags: ["死磕到底", "专业深耕", "极强耐力"] },
  "B_CC": { name: "蚁鴷", emoji: "🐦", desc: "你有着像树皮一样极佳的保护色，是一个极其低调的隐藏大佬。你注重养生和健康，生活得非常接地气。你不爱出风头，甚至有时候故意显得很普通。但在真正需要实力说话的时候，你总能出其不意地展现出惊人的能力，是那种“扮猪吃老虎”的类型。", tags: ["极致低调", "养生专家", "深藏不露"] },
  "B_CD": { name: "旋木雀", emoji: "🐦", desc: "你做事非常执着，一旦认定了方向，就会像沿树干螺旋向上一样，一步一个脚印地坚持到底。别人可能觉得这种重复枯燥乏味，但你却自得其乐。你在自己的节奏里稳扎稳打，内心极度充实，是不折不扣的长期主义者。", tags: ["长期主义", "耐得住寂寞", "执着"] },

  "B_DA": { name: "鸿雁", emoji: "🪿", desc: "你极其重视秩序、规则和集体利益。你做事非常有章法，无论遇到多大的困难，你都能稳住阵脚，不乱阵脚。你是团队里那个“定盘星”，只要有你在，大家就知道方向在哪里。你天生具备领导者的气质，但同时你也承担了比别人更多的责任。", tags: ["天生领导者", "秩序感强", "极度靠谱"] },
  "B_DB": { name: "斑头雁", emoji: "🪿", desc: "你的人生就像一条清晰的航线，起点和终点都非常明确。你不喜欢临时起意和变卦，做事有极强的规划性。一旦决定了目标，中途遇到任何诱惑都不会轻易改道。虽然在别人看来可能有些刻板，但也正因为如此，你总能比大多数人走得更稳、更远。", tags: ["目标导向", "路线清晰", "稳如泰山"] },
  "B_DC": { name: "灰雁", emoji: "🪿", desc: "你穿着灰褐色的羽毛，做人低调不张扬。你对生活有自己明确的要求，绝不随波逐流。在朋友眼里，你是一个极其靠谱的倾听者，总能给出最实在、最理性的建议。你不会用花言巧语去哄人，但你的每一个承诺都重如泰山。", tags: ["理性倾听者", "不盲从", "一诺千金"] },
  "B_DD": { name: "豆雁", emoji: "🪿", desc: "你是个很容易满足的人。主要吃植物性食物，说明你对生活的要求十分朴实。你不喜欢折腾，对吃喝住行有自己的小讲究，但绝不铺张浪费。在安稳的环境里，你能把自己养得白白胖胖，活得非常滋润。你深知，知足常乐才是人生的最高境界。", tags: ["知足常乐", "生活家", "极简主义"] },

  "C_AA": { name: "蜂鸟", emoji: "🐦", desc: "你精力旺盛、好奇心极重。就像那只唯一能悬停的鸟一样，你对什么新鲜事物都想尝一口，完全停不下来。你虽然容易被分散注意力，但也正因为这份好奇心，你总能发现别人忽略的甜头和机会。你活在当下，享受每一次心跳加速的探索。", tags: ["好奇宝宝", "精力无限", "活在当下"] },
  "C_AB": { name: "鹦鹉", emoji: "🦜", desc: "你脑子转得飞快，学什么都比别人快。你的食谱广，社交能力极强，不管是自己待着还是混迹在大群体里，你都能自洽。你最大的本事就是能把最无聊、最枯燥的日子，硬生生给盘出花样来。你是那种自带BGM出场的人，生活因你而有趣。", tags: ["聪明机灵", "超级学霸", "有趣的灵魂"] },
  "C_AC": { name: "犀鸟", emoji: "🐦", desc: "你拥有巨大的能力和才华（就像巨大的嘴），是人群中非常有主见的存在。你生活方式健康，对感情极度忠诚。在群体中，你常常扮演着大家长或者老大哥的角色，愿意为了保护同伴而挺身而出。你不仅能力出众，而且责任感爆棚。", tags: ["能力出众", "极度忠诚", "大家长风范"] },
  "C_AD": { name: "太阳鸟", emoji: "🐦", desc: "你就像你的名字一样，热爱自由，对世界充满无止境的好奇。只要有机会，你就想飞去不同的地方看看。在你的字典里，安定往往意味着无聊。你追求的是生命中的绚丽多彩，你喜欢做自己喜欢的事，绝不愿被任何人和事束缚住翅膀。", tags: ["向往自由", "色彩斑斓", "拒绝束缚"] },

  "C_BA": { name: "翠鸟", emoji: "🐦", desc: "你是个极致的专注者。你有一条长长的、锐利的喙，看准了猎物，就会一直死等，等到最佳时机再一头扎进水里。你不喜欢广撒网，别人觉得你固执死板，但只有你自己知道，那叫“值得”。你为了自己热爱的事物，愿意付出百分之百的专注和等待。", tags: ["极致专注", "冷静猎手", "死磕到底"] },
  "C_BB": { name: "夜鹭", emoji: "🐦", desc: "你和主流的节奏完全不一样，是个典型的“夜猫子”。白天你可能会表现得安静、甚至有点闷，但只要到了夜晚，或者到了真正属于你的时间段，你才会彻底活过来。你有着自己的时区，不要用别人的标准来衡量你，因为你的光芒只在特定的时间里闪耀。", tags: ["自我时区", "夜猫子", "暗中发力"] },
  "C_BC": { name: "绿鹭", emoji: "🐦", desc: "你不仅极度专注，而且聪明绝顶，甚至会使用工具（比如用小虫子诱捕鱼）。你是个非常有技巧的人，健康意识很强。你做事从不靠蛮力，而是靠策略和方法。在别人还在埋头苦干的时候，你已经用你独到的技巧，轻松拿到了最好的结果。", tags: ["智慧型选手", "善用工具", "注重技巧"] },
  "C_BD": { name: "蓝翡翠", emoji: "🐦", desc: "你羽色华丽，但性格却带着一丝神秘和孤傲。你习惯独来独往，不喜欢混迹在喧闹的人群中。你讨厌被各种条条框框束缚，对你来说，自由比什么都重要。在陌生的领域里，你反而能大放异彩，因为你有着别人没有的冷静和独立判断力。", tags: ["神秘独行", "独立判断", "向往自由"] },

  "C_CA": { name: "金雕", emoji: "🦅", desc: "你是天空中的顶级王者。你有极高的眼界和常人难以企及的耐心。平时你翱翔在高空，不声不响，似乎对什么都不屑一顾。但一旦你看准了猎物，到了真正的关键时刻，你会以雷霆万钧之势俯冲而下，一击必中。你不屑于在小事上纠缠，要做就做大事。", tags: ["降维打击", "格局宏大", "一击必中"] },
  "C_CB": { name: "猫头鹰", emoji: "🦉", desc: "你是享受独处的智者。你不喜欢任何无效社交，觉得那些纯属浪费生命。你的脑子在夜里最为清醒，你总是安静地观察着周围的一切。别人觉得你看起来疏离甚至有点冷漠，但其实你只是把有限的精力，全留给了真正重要的人和真正热爱的事。", tags: ["独处大师", "人间清醒", "高效专注"] },
  "C_CC": { name: "金雕（亚成）", emoji: "🦅", desc: "你还未完全褪去稚嫩的羽翼，但你心中已经有了高飞的野心。你正在积蓄力量，享受每一次在狂风中试飞的过程。你知道自己注定不凡，所以你愿意经历健康的磨练和严苛的考验。你的未来不可限量，只要你保持耐心，天空迟早是你的地盘。", tags: ["潜力股", "野心勃勃", "未来可期"] },
  "C_CD": { name: "海雕", emoji: "🦅", desc: "你生来就是干大事的。你喜欢宽广的天地，就像在海面上巡视的猛禽。你的眼神锐利，能一眼看穿事物的本质。你极度独立，做事雷厉风行，绝不拖泥带水。在你的世界里，只有极限和挑战，没有退缩和妥协。你是真正的自由霸主。", tags: ["雄心壮志", "雷厉风行", "自由霸主"] },

  "D_AA": { name: "白鹭", emoji: "🐦", desc: "你看起来条件很好、姿态极其优雅，但实际上你的生存手段非常灵活。不管环境怎么变，你都能在水边轻轻松松找到吃的。你看起来云淡风轻，好像什么都不在乎，其实你比谁都会审时度势。你不是没有脾气，只是你用最优雅的方式赢得了所有。", tags: ["优雅从容", "审时度势", "高手段"] },

// ===== 状态 =====
let currentQ = 0;
let answers = new Array(25).fill(null);
let finalBird = null;

// ===== 页面切换 =====
function showPage(id) {
  ['home', 'quiz', 'result'].forEach(p => {
    document.getElementById(p).style.display = 'none';
  });
  document.getElementById(id).style.display = 'block';
  window.scrollTo(0, 0);
}

function startQuiz() {
  currentQ = 0;
  answers = new Array(25).fill(null);
  showPage('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNumber').textContent = `第 ${currentQ + 1} 题`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('progressText').textContent = `${currentQ + 1} / ${questions.length}`;
  document.getElementById('progressFill').style.width = `${((currentQ + 1) / questions.length) * 100}%`;

  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  q.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option' + (answers[currentQ] === opt.l ? ' selected' : '');
    btn.innerHTML = `<span class="opt-letter">${opt.l}</span>${opt.t}`;
    btn.onclick = () => selectOption(opt.l);
    wrap.appendChild(btn);
  });

  document.getElementById('prevBtn').disabled = currentQ === 0;
  document.getElementById('nextBtn').textContent = currentQ === questions.length - 1 ? '查看结果' : '下一题';
  document.getElementById('nextBtn').disabled = answers[currentQ] === null;

  const card = document.getElementById('questionCard');
  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');
}

function selectOption(letter) {
  answers[currentQ] = letter;
  const opts = document.querySelectorAll('.option');
  const q = questions[currentQ];
  opts.forEach((btn, i) => {
    btn.classList.toggle('selected', q.opts[i].l === letter);
  });
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
  if (answers[currentQ] === null) return;
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

// ===== 结果计算（精准覆盖 32 种） =====
function calcResult() {
  const counts = { A: 0, B: 0, C: 0, D: 0 };
  answers.forEach(a => { if (a) counts[a]++; });

  let maxLetter = 'A';
  let maxCount = -1;
  ['A', 'B', 'C', 'D'].forEach(l => {
    if (counts[l] > maxCount) { maxCount = counts[l]; maxLetter = l; }
  });

  // 处理并列（看第25题选了啥）
  const tieLetters = ['A', 'B', 'C', 'D'].filter(l => counts[l] === maxCount);
  if (tieLetters.length > 1) {
    const q25 = answers[24];
    if (q25 && tieLetters.includes(q25)) {
      maxLetter = q25;
    }
  }

  // 根据第3题(索引2)和第22题(索引21)决定后缀，直接对应 A/B/C/D
  const q3 = answers[2] || 'A';
  const q22 = answers[21] || 'A';
  
  const suffix1 = q3; // A, B, C, D
  const suffix2 = q22; // A, B, C, D

  const key = `${maxLetter}_${suffix1}${suffix2}`;
  return birdDB[key] || birdDB["A_AA"]; // 兜底
}

function showResult() {
  finalBird = calcResult();
  document.getElementById('birdEmoji').textContent = finalBird.emoji;
  document.getElementById('birdName').textContent = finalBird.name;
  document.getElementById('birdDesc').textContent = finalBird.desc;
  
  const tagsWrap = document.getElementById('resultTags');
  tagsWrap.innerHTML = '';
  finalBird.tags.forEach(tag => {
    const span = document.createElement('span');
    span.className = 'tag';
    span.textContent = tag;
    tagsWrap.appendChild(span);
  });

  showPage('result');
}

function restart() {
  showPage('home');
}

function shareResult() {
  if (!finalBird) return;
  const text = `我测出来是【${finalBird.name}】！${finalBird.desc}`;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      alert('结果已复制到剪贴板，快去分享吧！');
    }).catch(() => {
      prompt('复制失败，请手动复制以下内容：', text);
    });
  } else {
    prompt('请手动复制以下内容进行分享：', text);
  }
}
